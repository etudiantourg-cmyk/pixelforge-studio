name: PIXELFORGE validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund
      - name: Run project validation
        run: npm run validate
      - name: Smoke-test VTracer WASM engine
        run: npm run test:vtracer

  strict-critic:
    needs: static-validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run non-tolerant acceptance gate
        run: npm run critic

  mockup-browser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pinned project and browser test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium with WebGL software renderer
        run: npx playwright install --with-deps chromium
      - name: Render and inspect all 3D mockup PNGs in Chromium
        run: npm run test:mockups
